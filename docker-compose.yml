services:
  neo4j:
    image: neo4j:5
    container_name: graft_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/graftpassword
    volumes:
      - ./graph/neo4j_data:/data

  qdrant:
    image: qdrant/qdrant
    container_name: graft_qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant/storage:/qdrant/storage

  ollama:
    image: ollama/ollama
    container_name: graft_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
