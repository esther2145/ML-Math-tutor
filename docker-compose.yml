services:
  backend:
    build: .
    image: graft-math-tutor:local
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend:ro
      - ./data:/app/data:ro
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      QDRANT_URL: http://qdrant:6333
      QDRANT_TIMEOUT: ${QDRANT_TIMEOUT:-60}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-320}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-300}
      MINIMUM_RELEVANCE_SCORE: ${MINIMUM_RELEVANCE_SCORE:-0.35}
    depends_on:
      - neo4j
      - qdrant
      - ollama

  ui:
    image: graft-math-tutor:local
    command:
      - streamlit
      - run
      - streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit_app.py:/app/streamlit_app.py:ro
    environment:
      API_URL: http://backend:8000
      TUTOR_REQUEST_TIMEOUT: ${TUTOR_REQUEST_TIMEOUT:-330}
    depends_on:
      - backend

  neo4j:
    image: neo4j:5
    container_name: graft_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - ./graph/neo4j_data:/data

  qdrant:
    image: qdrant/qdrant
    container_name: graft_qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - ./qdrant/storage:/qdrant/storage

  ollama:
    image: ollama/ollama
    container_name: graft_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
